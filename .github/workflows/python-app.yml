# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install dependencies
        # --locked fails if uv.lock is out of date with pyproject.toml,
        # so the committed lockfile is what actually gets tested.
        run: uv sync --locked
      - name: Lint with flake8
        run: |
          # stop the build if there are Python syntax errors or undefined names
          uvx flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --extend-exclude=.venv,venv
          # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
          uvx flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics --extend-exclude=.venv,venv
      - name: Test with pytest
        run: uv run pytest
