# This workflow will upload a Python Package using Twine when a release is created
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python#publishing-to-package-registries

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Upload Python Package

on:
  release:
    types: [published]
  # Allows retrying a release run that failed before the upload step. PyPI
  # rejects re-uploads of an existing version, so this cannot replace an
  # artifact that already published.
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag or ref to build from (e.g. v0.6.0). Defaults to the ref this run was started from."
        required: false
        type: string

permissions:
  contents: read

jobs:
  deploy:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
      with:
        # Without this a manual run builds branch HEAD rather than the tag.
        ref: ${{ inputs.ref || github.ref }}
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.x'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build
    - name: Build package
      run: python -m build
    - name: Publish package
      # Older pins ship a twine too old to read Metadata-Version 2.5.
      uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
      with:
        user: __token__
        password: ${{ secrets.PYPI_API_TOKEN }}
        # Attestations require Trusted Publishing; unusable with token auth.
        attestations: false
